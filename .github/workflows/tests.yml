name: Tests

# Runs the Python tests on every push and pull request. The agent task tests use
# plain commands only (no AI) and a fake GitHub, so they need no secrets.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "aiohttp>=3.9" "numpy>=1.24" "pytest>=8" "uv==0.13.7"

      - name: Git identity for the test repositories
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main

      - name: Run the tests
        env:
          HARNESS_AGENT_CLIS: ""
        run: python -m pytest -q -p no:cacheprovider tests

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Agents app smoke test
        run: |
          npm install --no-save --no-audit --no-fund jsdom@26
          node --check yourharness/web/app.js
          node --check yourharness/web/batch.js
          node tests/web/agents_smoke.mjs
          node tests/web/batch_smoke.mjs
