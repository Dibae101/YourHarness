name: Build apps

# Builds the Mac (.dmg) and Windows (.exe installer) apps.
# Push a tag like v0.3.0 to publish them on the Releases page, or run this workflow by hand
# from the Actions tab to get them as downloadable artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac dmg
            label: mac
          - os: windows-latest
            target: --win nsis
            label: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Name the engine after the tag (v1.2.3 becomes 1.2.3)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: python desktop/set_version.py "${GITHUB_REF_NAME#v}"

      - name: Build the engine (Python program with everything inside)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller aiohttp numpy qrcode
          if [ "$RUNNER_OS" = "Windows" ]; then pip install pywinpty; fi
          cd desktop
          pyinstaller backend.spec --noconfirm --distpath ../build/dist --workpath ../build/work

      - name: Name the app after the tag (v1.2.3 becomes 1.2.3)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: desktop
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build the app
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci
          npx electron-builder ${{ matrix.target }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: YourHarness-${{ matrix.label }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
