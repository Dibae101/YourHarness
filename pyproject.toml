[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yourharness"
version = "0.7.0"
description = "Pool the devices you own into one workspace for AI work."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "aiohttp>=3.9",
  "numpy>=1.24",
]

[project.optional-dependencies]
qr = ["qrcode>=7"]
dev = ["pytest>=8", "qrcode>=7"]

[project.scripts]
harness = "yourharness.cli:main"

[tool.setuptools.packages.find]
include = ["yourharness*"]

[tool.setuptools.package-data]
yourharness = ["web/*", "web/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
